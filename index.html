<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,500&family=Onest:wght@600;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: the church's monthly poster as an interface. Cool paper, heavy black grotesque,
   a colour bar per meeting type, Scripture in its own serif voice, and one night panel with a city
   on a hill where every prayer is a light. Controls behave like native iOS ones. Left-aligned.
   Skins (Christmas, Cosmos) swap the same tokens and the scene. */
:root{
  --paper:#ECEEF2; --surface:#FFFFFF; --ink:#0D0E11; --muted:#5B616D; --line:#D5D9E1;
  --accent:#3F54E6; --accent-ink:#FFFFFF; --backdrop:#DDE0E6;
  --night-1:#14110F; --night-2:#3C3028; --night-ink:#F8F4EC; --night-muted:#C2B8AB; --glow:#FFD27A;
  --k-sunday:#4F7BFF; --k-heaven:#F2A237; --k-leaders:#E0348F; --k-evenings:#63B216; --k-prayer:#0D0E11; --k-daily:#A2A7B1;
  --font-display:'Onest','Arial Black','Helvetica Neue',Arial,sans-serif;
  --font-body:'Golos Text',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-word:'Literata','Iowan Old Style',Georgia,'Times New Roman',serif;
  --spring:cubic-bezier(.3,1.35,.5,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E0F12; --surface:#191B20; --ink:#F2F3F6; --muted:#9AA1AE; --line:#2B2E36;
    --accent:#8F9CFF; --accent-ink:#0E0F12; --backdrop:#070809;
    --night-1:#1E1A17; --night-2:#48392E; --k-prayer:#F2F3F6; --k-evenings:#A6E24B; --k-daily:#6F7480;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E0F12; --surface:#191B20; --ink:#F2F3F6; --muted:#9AA1AE; --line:#2B2E36;
  --accent:#8F9CFF; --accent-ink:#0E0F12; --backdrop:#070809;
  --night-1:#1E1A17; --night-2:#48392E; --k-prayer:#F2F3F6; --k-evenings:#A6E24B; --k-daily:#6F7480;
  color-scheme:dark;
}
:root[data-skin="xmas"]{
  --paper:#0E1F1A; --surface:#17322B; --ink:#F8F1E4; --muted:#A7BDB2; --line:#28463C;
  --accent:#EDBB52; --accent-ink:#1B1304; --backdrop:#08130F;
  --night-1:#081127; --night-2:#1F3566; --night-muted:#B7C3DE; --glow:#FFE2A0; --k-prayer:#F8F1E4; --k-evenings:#A6E24B; --k-daily:#6E857B;
  color-scheme:dark;
}
:root[data-skin="joy"]{
  --paper:#FFF4EA; --surface:#FFFFFF; --ink:#3B2A4D; --muted:#8B7A99; --line:#F2E1D3;
  --accent:#FF6F5B; --accent-ink:#FFFFFF; --backdrop:#FCE7D8;
  --night-1:#5B6CFF; --night-2:#B07CFF; --night-ink:#FFFFFF; --night-muted:#F1E9FF; --glow:#FFE38A;
  --k-prayer:#3B2A4D; --k-daily:#B3A6C2;
  --font-display:'Nunito','Onest','Arial Rounded MT Bold',sans-serif;
  color-scheme:light;
}
:root[data-skin="cosmos"]{
  --paper:#070816; --surface:#14152F; --ink:#EEECFF; --muted:#A09EC8; --line:#27284D;
  --accent:#A592FF; --accent-ink:#0B0920; --backdrop:#03030A;
  --night-1:#090720; --night-2:#2E1D66; --night-muted:#B9B2E6; --glow:#BFE9FF; --k-prayer:#EEECFF; --k-evenings:#A6E24B; --k-daily:#6A6996;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--backdrop);color:var(--ink);font:400 15.5px/1.45 var(--font-body);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
img{max-width:100%;display:block}

html{height:var(--vh,100%)}html body{height:var(--vh,100%)}
html.kb .tabs{display:none}
html.kb .g-form{padding-bottom:12px}
#app{height:100%;width:100%;max-width:440px;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden;transition:background .4s}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
:root[data-skin="xmas"] #fx{z-index:7}
.top,main,.tabs{position:relative;z-index:1}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 6px}
.mark{font:800 17px/1 var(--font-display);letter-spacing:-.01em;background:none;border:0;padding:12px 0;margin:-6px 0;white-space:nowrap}
@media (max-width:350px){.tabs button{font-size:9.5px;letter-spacing:-.01em}.mark{font-size:15px}.top{gap:6px;padding-left:14px;padding-right:14px}.top-r{gap:5px!important}.lang button{min-width:34px;padding:8px 6px}}
.mark b{color:var(--accent);font-weight:800}
.top-r{display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 8%,transparent);display:grid;place-items:center}
.th-note{width:15px!important;height:15px!important;margin-left:-2px;opacity:.75}
.th-lang .lang{display:inline-flex}
.icon-btn.theme-btn{width:auto;height:40px;display:inline-flex;gap:6px;padding:0 14px 0 11px;border-radius:999px;font:600 13px/1 var(--font-body);color:var(--ink)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lang{display:flex;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:999px;padding:2px}
.lang button{border:0;background:none;padding:8px 9px;min-width:40px;min-height:36px;font:600 12px/1 var(--font-body);color:var(--muted);border-radius:999px}
.lang button[aria-pressed="true"]{color:var(--ink);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.me{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font:800 15px/1 var(--font-display)}
main{flex:1;overflow-y:auto;padding:8px 18px 34px;display:flex;flex-direction:column;gap:26px;overscroll-behavior:contain}
main>*{flex-shrink:0}

h1{font:900 42px/.95 var(--font-display);letter-spacing:-.035em;text-wrap:balance}
h2{font:800 22px/1.1 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
h3{font:600 16px/1.25 var(--font-body)}
.sub{color:var(--muted);font-size:14.5px}
h2.t3{font:600 16px/1.25 var(--font-body);letter-spacing:0}
.note{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{align-self:flex-start;background:none;border:0;padding:10px 12px 10px 0;min-height:44px;color:var(--accent);font-weight:500;margin-bottom:-14px;display:flex;align-items:center;gap:2px}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-left:-6px}

/* press feedback: quick down, springy release */
.btn,.going,.chip,.day,.tabs button,.icon-btn,.me,.thumb,.tile,.vbar button{transition:transform .32s var(--spring),opacity .2s,background-color .2s,color .2s,box-shadow .2s}
.btn:active,.going:active,.chip:active,.day:active,.icon-btn:active,.me:active,.thumb:active,.tile:active,.vbar button:active{transform:scale(.955);opacity:.82;transition-duration:.07s}
.tabs button:active{transform:scale(.9);transition-duration:.07s}
.cell-row{transition:background-color .15s}
.cell-row:active{background:color-mix(in srgb,var(--ink) 7%,transparent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:0 20px;height:50px;background:var(--ink);color:var(--paper);font:600 16px/1 var(--font-body);text-decoration:none;white-space:nowrap}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.tint{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.btn.light{background:var(--night-ink);color:#15120F}
.night .btn.tint{background:rgba(255,255,255,.16);color:var(--night-ink)}
/* glass buttons: a gentle sheen, a fine bright edge, no spilled glow */
.btn.accent,.btn.tint,.dv-now .pill{position:relative;isolation:isolate;-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5)}
.btn.accent::before,.btn.tint::before,.dv-now .pill::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.12)}
.btn.accent,.dv-now .pill{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent));box-shadow:0 1px 2px rgba(0,0,0,.18)}
.btn.tint{background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:none}
.btn.tint::before{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn.small{height:38px;padding:0 15px;border-radius:999px;font-size:14.5px}
.btn.wide{width:100%}
.btn svg,.going svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;padding:10px 0;margin:-10px 0;color:var(--accent);font-weight:600;text-decoration:none;font-size:14.5px}
.night .link{color:var(--night-ink)}
.going{flex:none;border:0;border-radius:999px;padding:0 14px;height:38px;background:color-mix(in srgb,var(--accent) 15%,transparent);font:600 14.5px/1 var(--font-body);text-decoration:none;color:var(--accent);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.going[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.going svg{stroke-dasharray:22;stroke-dashoffset:0}
@media (prefers-reduced-motion:no-preference){.just[aria-pressed="true"] svg,.step.just.ok .ck svg{animation:tick .4s ease-out .08s both}.just[aria-pressed="true"],.step.just.ok .ck{animation:popin .42s var(--spring)}@keyframes popin{0%{transform:scale(.86)}100%{transform:scale(1)}}@keyframes tick{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}}
.night .going{background:rgba(255,255,255,.16);color:var(--night-ink)}
.night .going[aria-pressed="true"]{background:var(--glow);color:#17120a}

/* night panel and scene */
.night{--k-prayer:#FFFFFF;--k-evenings:#A6E24B;--k-daily:#8E857A;--muted:var(--night-muted);background:radial-gradient(130% 80% at 30% 0%,var(--night-2),var(--night-1) 72%);color:var(--night-ink);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.night-in{padding:22px 20px 0;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.night .when{color:var(--night-muted);font-size:14.5px}
.night .big{font:900 31px/1 var(--font-display);letter-spacing:-.03em;text-wrap:balance}
canvas.scene{display:block;width:100%;height:168px;margin-top:-18px}
.lit{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 18px 14px;font-size:13.5px;color:var(--night-ink);background:none;border:0;text-align:left;width:100%}
.lit b{font:800 17px/1 var(--font-display);color:var(--glow);margin-right:4px}
.lit i{font-style:normal;font-size:12px;color:var(--night-muted)}
.night-pad{padding:20px 16px 18px;display:flex;flex-direction:column;gap:14px}
.rule{height:1px;background:rgba(255,255,255,.14)}

/* Scripture voice */
.word{display:flex;flex-direction:column;gap:10px}
.scripture{font:italic 500 28px/1.16 var(--font-word);letter-spacing:-.01em;text-wrap:balance}
.ref{font-weight:600;font-size:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;background:none;border:0;padding:6px 0;font-size:15.5px;text-align:left;width:100%}
.switch i{flex:none;width:51px;height:31px;border-radius:999px;background:color-mix(in srgb,var(--ink) 16%,transparent);position:relative;transition:background .22s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .3s var(--spring)}
.switch[aria-checked="true"] i{background:#34C759}
.switch[aria-checked="true"] i::after{transform:translateX(20px)}
.switch[disabled]{opacity:.45}

/* week strip and month */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{background:none;border:0;border-radius:14px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.day small{font:600 11px/1 var(--font-body);color:var(--muted)}
.day.is-today small{color:var(--accent)}
.n{font:800 18px/1 var(--font-display);min-width:32px;padding:6px 0;border-radius:9px;font-variant-numeric:tabular-nums;text-align:center}
.day[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.1),inset 0 0 0 1.5px var(--ink)}
.n.hl-leaders{background:color-mix(in srgb,var(--k-leaders) 86%,#000);color:#fff}
.n.hl-teens{background:var(--k-heaven);color:#1a1410}
.bars{display:flex;flex-direction:column;gap:3px;min-height:11px;align-items:center}
.bars i,.bar{display:block;width:22px;height:4px;border-radius:4px}
.b-sunday{background:var(--k-sunday)}.b-heaven,.b-teens{background:var(--k-heaven)}.b-leaders{background:var(--k-leaders)}
.b-evenings{background:var(--k-evenings)}.b-prayer{background:var(--k-prayer)}.b-daily{background:var(--k-daily)}
.month{display:grid;grid-template-columns:repeat(7,1fr);row-gap:10px}
.month .wd{font:600 11px/1 var(--font-body);color:var(--night-muted);text-align:center;padding-bottom:4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px}
.cell .n{font-size:16px;min-width:30px;padding:5px 0;border-radius:8px}
.cell.is-today .n:not([class*="hl-"]){box-shadow:inset 0 0 0 1.5px var(--night-ink)}
.cell.past{opacity:.55}

/* meeting rows */
.mts{border-top:1.5px solid var(--ink)}
.mt{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mt>.bar{flex:none;width:5px;height:38px;border-radius:5px;align-self:flex-start;margin-top:3px}
.mt-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.mt-main strong{font-weight:600}
.mt-main span{font-size:13.5px;color:var(--muted)}
.mt.past{opacity:.5}
.night .mts{border-top:0}.night .mt{border-bottom:0;padding:7px 0}.night .mt>.bar{width:22px;height:4px;margin-top:8px}
.att{display:flex;align-items:center;gap:8px;margin-top:4px}
.avs{display:flex}
.avs i{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font:600 10.5px/22px var(--font-body);font-style:normal;text-align:center;margin-left:-6px;box-shadow:0 0 0 2px var(--paper)}
.avs i:first-child{margin-left:0}
.avs i.mine{background:var(--accent);color:var(--accent-ink)}
.night .avs i{background:rgba(255,255,255,.22);color:var(--night-ink);box-shadow:none}
.night .avs i.mine{background:var(--glow);color:#17120a}
.sheet .avs i{box-shadow:0 0 0 2px var(--surface)}

.card{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.tag{align-self:flex-start;font:500 12px/1 var(--font-body);padding:5px 8px;border-radius:7px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--muted)}
.tag.t-give{background:var(--k-evenings);color:#12200a}.tag.t-need{background:var(--k-heaven);color:#231503}
.tag.t-sell{background:color-mix(in srgb,var(--k-sunday) 78%,#000);color:#fff}.tag.t-seek{background:color-mix(in srgb,var(--k-leaders) 86%,#000);color:#fff}
.tag.wait{background:var(--k-heaven);color:#231503}

.list{border-top:1.5px solid var(--ink)}
.list>li{border-bottom:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:8px}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.list>li.ev{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:8px;align-items:start}
.ev .date-big{grid-row:span 2}
.date-big{font:900 30px/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.date-big small{display:block;font:600 12.5px/1.2 var(--font-body);letter-spacing:0;color:var(--muted);margin-top:5px}
.num{font:800 20px/1 var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums}

/* iOS segmented control with a sliding thumb */
.seg{--i:0;--n:2;position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:11px;padding:2px}
.seg::before{content:"";position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));transform:translateX(calc(var(--i)*100%));background:var(--surface);border-radius:9px;box-shadow:0 1px 3px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.04);transition:transform .34s var(--spring)}
.seg button{position:relative;border:0;background:none;height:38px;font:500 13.5px/1 var(--font-body);color:var(--ink);border-radius:9px;white-space:nowrap;padding:0 4px}
.seg button[aria-pressed="true"]{font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:11px;padding:10px 13px;background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:4px 0 12px}
.chs .chip{padding:11px 0;text-align:center;font-variant-numeric:tabular-nums;position:relative}
.chs .chip.has::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.chs .chip[aria-pressed="true"].has::after{background:var(--accent-ink)}
.progress{height:6px;border-radius:6px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s var(--spring)}
.books{border-top:1.5px solid var(--ink)}
.books>li{border-bottom:1px solid var(--line)}
.book{width:100%;background:none;border:0;padding:13px 0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;align-items:baseline}
.book strong{font-weight:600}
.book span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.book .progress{grid-column:1/-1;height:3px}
.book.full strong{color:var(--accent)}

/* Bible reader */
.reader-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.where{border:0;background:none;padding:0;font:900 30px/1 var(--font-display);letter-spacing:-.03em;display:flex;align-items:center;gap:6px;text-align:left}

.fs{display:flex;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:999px}

.v.hl-y{background:color-mix(in srgb,#F5C518 42%,transparent)}
.v.hl-g{background:color-mix(in srgb,#34C759 34%,transparent)}
.v.hl-p{background:color-mix(in srgb,#FF5C8A 34%,transparent)}
.v.sel{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:5px}
.v.noted::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin:0 4px 2px 2px;vertical-align:middle}
.v.marked sup::before{content:"★ "}
.vbar{position:absolute;left:10px;right:10px;bottom:78px;z-index:4;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-radius:20px;box-shadow:0 10px 34px rgba(0,0,0,.24),0 0 0 .5px color-mix(in srgb,var(--ink) 14%,transparent);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.vbar .row{justify-content:space-between;flex-wrap:nowrap}
.vbar strong{font-size:14.5px}
.dots{display:flex;gap:8px}
.dot{width:34px;height:34px;border-radius:50%;border:0;padding:0}
.dot.y{background:#F5C518}.dot.g{background:#34C759}.dot.p{background:#FF5C8A}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.vbar .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vbar .acts button{border:0;border-radius:12px;height:42px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font:600 14px/1 var(--font-body)}
.vbar .acts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.x{width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 10%,transparent);display:grid;place-items:center;flex:none}
.x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;fill:none}
@media (prefers-reduced-motion:no-preference){.vbar{animation:rise .32s var(--spring)}@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* HeavenOS cards */
.flip{perspective:1400px;align-self:center;width:min(100%,292px)}
.flip-in{position:relative;aspect-ratio:580/982;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.85,.25,1.05)}
.flip.open .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.face.front{transform:rotateY(180deg);background:var(--surface)}
.face img{width:100%;height:100%;object-fit:cover}
.face.backside{border:0;padding:0;background:linear-gradient(160deg,#5446A5,#263D6F 62%,#14110F);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;text-align:center}
.backside .os{font:900 34px/1 var(--font-display);letter-spacing:-.03em}
.backside .ring{width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;font:900 38px/1 var(--font-display);margin-bottom:8px}
.backside small{font-size:13.5px;opacity:.8}
@media (prefers-reduced-motion:no-preference){
  .backside .ring{animation:breathe 2.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.28)}50%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
}
.cmd{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.cmd p.c{font:800 21px/1.14 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.cflow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px calc(50% - 76px) 22px;margin:0 -18px;scrollbar-width:none;perspective:900px}
.cflow::-webkit-scrollbar{display:none}
.thumb{flex:none;width:152px;aspect-ratio:580/982;border:0;padding:0;border-radius:14px;overflow:hidden;scroll-snap-align:center;background:var(--surface);position:relative;box-shadow:0 10px 24px rgba(0,0,0,.2);will-change:transform}
.thumb img{width:100%;height:100%;object-fit:cover}
.cflow .thumb{transition:none}
.thumb.done::after{content:"✓";position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:#34C759;color:#fff;font:700 15px/26px var(--font-body);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.card-big{align-self:center;width:min(78%,300px);aspect-ratio:580/982;border-radius:20px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.3)}
.cv{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;background:var(--surface)}
.cv h3{display:flex;align-items:center;gap:8px}
.cv-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:cv}
.cv-list li{counter-increment:cv;position:relative;padding-left:30px}
.cv-list li::before{content:counter(cv);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 12px/1 var(--sans,inherit);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.cv-h{display:flex;align-items:center;gap:8px}
.cv-ref{font-weight:600}
.cv-t{margin:4px 0 0;font-family:var(--font-word);font-style:italic;line-height:1.5}
.cv-prev{margin:0}
.card-big{padding:0;border:0;background:none;display:block;flex:none;width:min(78%,300px,calc((100dvh - 330px)*0.5906));min-width:150px;cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:200;background:rgba(5,6,15,.92);display:grid;place-items:center;padding:16px}
.zoom img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:no-preference){.card-big.deal{animation:deal .55s var(--spring)}@keyframes deal{from{transform:translateY(30px) rotate(-5deg) scale(.86);opacity:0}to{transform:none;opacity:1}}}
.teaser{display:flex;gap:14px;align-items:center;background:var(--surface);border:0;border-radius:22px;padding:12px;text-align:left;width:100%}
.teaser .mini{flex:none;width:58px;aspect-ratio:580/982;border-radius:9px;overflow:hidden;background:linear-gradient(160deg,#5446A5,#263D6F);display:grid;place-items:center;color:#fff;font:900 20px/1 var(--font-display)}
.teaser strong{display:block;font:800 19px/1.1 var(--font-display);letter-spacing:-.015em}

.hub-h{font-size:34px;margin-bottom:6px}
.hub{display:flex;flex-direction:column}
.hub-row{width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;padding:10px 0;text-align:left;color:var(--ink);font:inherit;position:relative;transition:transform .18s var(--spring)}
.hub-row+.hub-row::before{content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--line)}
.hub-row:active{transform:scale(.98)}
.hub-ic{flex:none;position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--c);isolation:isolate;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 26%,transparent),color-mix(in srgb,var(--c) 8%,transparent) 60%,color-mix(in srgb,var(--c) 18%,transparent));
  backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),0 6px 16px -8px color-mix(in srgb,var(--c) 70%,transparent);transition:transform .25s var(--spring)}
.hub-ic::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:-1;
  background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,.08) 40%,color-mix(in srgb,var(--c) 45%,transparent) 75%,rgba(255,255,255,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.hub-ic::after{content:"";position:absolute;left:3px;right:3px;top:2px;height:45%;border-radius:12px 12px 40% 40%;z-index:-1;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hub-ic{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 20px -10px color-mix(in srgb,var(--c) 80%,transparent)}:root:not([data-theme="light"]) .hub-ic::before{background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,.04) 40%,color-mix(in srgb,var(--c) 55%,transparent) 75%,rgba(255,255,255,.18))}:root:not([data-theme="light"]) .hub-ic::after{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0))}}
:root[data-theme="dark"] .hub-ic{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 20px -10px color-mix(in srgb,var(--c) 80%,transparent)}:root[data-theme="dark"] .hub-ic::before{background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,.04) 40%,color-mix(in srgb,var(--c) 55%,transparent) 75%,rgba(255,255,255,.18))}:root[data-theme="dark"] .hub-ic::after{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0))}
.hub-row:hover .hub-ic{transform:translateY(-1px)}
.hub-row:active .hub-ic{transform:scale(.9) rotate(-4deg)}
.hub-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin:0}
.hub-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hub-t strong{font:700 17px/1.2 var(--font-display);letter-spacing:-.01em}
.hub-t small{font-size:13px;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-row>svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.6;transition:transform .2s}
.hub-row:hover>svg{transform:translateX(3px)}
.hub .badge{margin-left:auto}
@media (prefers-reduced-motion:no-preference){
  .hub.in .hub-row{animation:hubIn .5s var(--spring) both;animation-delay:var(--d)}
  .hub.in .hub-ic svg *{stroke-dasharray:1;stroke-dashoffset:1;animation:hubDraw .7s ease-out forwards;animation-delay:calc(var(--d) + 150ms)}
  @keyframes hubIn{from{opacity:0;transform:translateY(10px)}}
  @keyframes hubDraw{to{stroke-dashoffset:0}}}
.menu{border-top:1.5px solid var(--ink)}
.menu button{width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 0;text-align:left}
.menu strong{display:block;font:800 19px/1.1 var(--font-display);letter-spacing:-.015em}
.menu span{font-size:13.5px;color:var(--muted)}
.menu .bar{flex:none;width:6px;height:36px;border-radius:6px}
.menu svg{margin-left:auto;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.kv{border-top:1.5px solid var(--ink)}
.kv>div{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}

.kv code{font:500 14.5px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;user-select:all;overflow-wrap:anywhere}
.kv b{font:800 18px/1 var(--font-display);font-variant-numeric:tabular-nums}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
input[type=text],input[type=search],input[type=time],input[type=date],input[type=number],input[type=url],input.field,textarea,select{width:100%;background:color-mix(in srgb,var(--ink) 6%,transparent);border:1.5px solid transparent;border-radius:13px;padding:13px;font-size:16px;font-weight:400}

input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
.opt{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15.5px}

fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}

.sheet-wrap{position:absolute;inset:0;background:rgba(6,6,10,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:flex-end;z-index:8}
.sheet{background:var(--surface);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px 26px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}

}

@keyframes joyHop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-6px) scale(.92,1.1)}60%{transform:translateY(0) scale(1.12,.88)}100%{transform:none}}
.tile .p-joy{background:radial-gradient(circle at 70% 24%,#FFF3B0 0 7%,transparent 8%),radial-gradient(120% 60% at 50% 100%,#7FD686 0 40%,transparent 41%),radial-gradient(70% 40% at 20% 92%,#A6E59B 0 50%,transparent 51%),linear-gradient(#6FA8FF,#BFD9FF 55%,#FFD9C2)}

  @keyframes hlSay{0%,70%{opacity:0;transform:translateY(6px) scale(.6)}74%,86%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateY(-6px)}}

/* magic opening */
.bk-ov{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(40,28,70,.6),rgba(6,5,14,.92));opacity:0;transition:opacity .35s}

.bk-cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d}
.bk-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:2px 8px 8px 2px;backface-visibility:hidden;box-shadow:inset 4px 0 0 rgba(255,255,255,.15)}
.bk-cover-back{position:absolute;inset:0;background:var(--c);border-radius:8px 2px 2px 8px;transform:rotateY(180deg);backface-visibility:hidden}
.bk-dust{position:absolute;left:50%;top:50%}
.bk-dust i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#FFE3A0;box-shadow:0 0 10px #FFC94D;opacity:0}
.bk-ov.go .bk-book{animation:bkIn .7s cubic-bezier(.2,.9,.3,1.1) forwards,bkZoom .6s cubic-bezier(.6,0,.8,.4) 1.75s forwards}
.bk-ov.go .bk-cover{animation:bkCov 1.1s cubic-bezier(.5,0,.2,1) .6s forwards}
.bk-ov.go .bk-leaf{animation:bkLeaf .9s cubic-bezier(.5,0,.2,1) forwards;animation-delay:calc(.75s + var(--k) * .09s)}
.bk-ov.go .bk-glow{animation:bkGlowA 1.6s ease-out .7s forwards}
.bk-ov.go .bk-dust i{animation:bkDust 1.4s ease-out forwards;animation-delay:calc(.75s + var(--d) * .4)}
@keyframes bkIn{to{transform:scale(1) rotateY(0) rotateX(0)}}
@keyframes bkZoom{from{transform:scale(1)}to{transform:scale(3.2) translateX(-10%);opacity:0}}
@keyframes bkCov{to{transform:rotateY(-168deg)}}
@keyframes bkLeaf{0%{transform:rotateY(0)}100%{transform:rotateY(calc(-150deg - var(--k) * 4deg))}}
@keyframes bkGlowA{0%{transform:scale(0);opacity:0}30%{opacity:1}100%{transform:scale(70);opacity:0}}
@keyframes bkDust{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
/* comic tour */
.cx{display:flex;flex-direction:column;gap:22px;padding:4px 4px 10px}
.cx-p{position:relative;background:var(--surface);border:3px solid var(--ink);border-radius:8px 20px 10px 18px;box-shadow:6px 6px 0 var(--ink);padding:14px 14px 16px;transform:rotate(var(--r));display:flex;flex-direction:column;gap:10px}
.cx-p::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1.1px,transparent 1.4px);background-size:9px 9px;-webkit-mask:linear-gradient(135deg,#000,transparent 45%);mask:linear-gradient(135deg,#000,transparent 45%)}
.cx-cap{align-self:flex-start;background:#FFE14D;color:#1E1A12;border:2px solid #1E1A12;padding:3px 9px;font:800 12.5px/1.2 'Nunito',var(--font-body);transform:rotate(-1.5deg);position:relative}

.cx-row{display:flex;gap:10px;align-items:flex-end;position:relative}
.cx-art{flex:none;width:92px;display:grid;place-items:center;color:var(--ink)}
.cx-bs{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}

.cx-b:last-child::after{content:"";position:absolute;left:-12px;bottom:12px;width:14px;height:14px;background:#fff;border-left:2.5px solid #1E1A12;border-bottom:2.5px solid #1E1A12;transform:skewY(-30deg) rotate(10deg);border-radius:0 0 0 4px}
.cx-x{display:flex;flex-direction:column;gap:10px;position:relative}
.cx-note{font:700 13.5px/1.35 'Nunito',var(--font-body);color:var(--muted);text-align:center}
.cx-x .tiles span{border-radius:10px}
.cx-lamb{width:92px;height:92px;overflow:visible}
.cx-sky{width:88px;height:88px;border-radius:14px;border:2.5px solid currentColor;position:relative;overflow:hidden;background:linear-gradient(#6FA8FF,#BFD9FF 60%,#FFD9C2)}
.cx-sky .o{position:absolute;left:50%;top:70%;width:0;height:0}
.cx-sky .o b{position:absolute;left:-34px;top:-8px;width:16px;height:16px;border-radius:50%;background:#FFE9A0;box-shadow:0 0 12px #FFD86B;transform-origin:34px 8px}
.cx-sky .h{position:absolute;left:-10%;right:-10%;bottom:-30%;height:60%;border-radius:50%;background:#7FD686;border-top:2.5px solid currentColor}
.cx-sky .c{position:absolute;left:8px;top:14px;width:24px;height:10px;border-radius:10px;background:#fff;box-shadow:8px -5px 0 -1px #fff}
.cx-book{width:88px;color:var(--ink)}
.cx-book .pg{transform-origin:50px 40px}
.cx-orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#FFE9B0,#FFC24D 55%,#E08A12);box-shadow:0 0 0 3px var(--ink),0 0 24px rgba(255,190,70,.8)}
.cx-orb svg{width:32px;height:32px;fill:rgba(255,255,255,.45);stroke:#3A2400;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cx-cards{position:relative;width:88px;height:84px}
.cx-cards i{position:absolute;left:28px;top:8px;width:40px;height:56px;border-radius:7px;border:2.5px solid var(--ink);transform-origin:50% 120%}
.cx-cards i:nth-child(1){background:#243A73;transform:rotate(-16deg)}.cx-cards i:nth-child(2){background:#F6C3A6;transform:rotate(0)}.cx-cards i:nth-child(3){background:#6B1A30;transform:rotate(16deg)}

.cx-h{font-size:38px}
@media (prefers-reduced-motion:no-preference){
  .cx-p{opacity:0;transform:translateY(24px) rotate(calc(var(--r) - 3deg)) scale(.94)}

  .cx-p.seen{transition:none}
  .cx-p .cx-b{opacity:0;transform:scale(.7) translateY(8px);transform-origin:0 100%}

.lamp.next .orb{box-shadow:0 0 0 2px color-mix(in srgb,#FFC552 70%,transparent)}
@media (prefers-reduced-motion:no-preference){.lamp.next .orb{animation:lampNext 2.4s ease-in-out infinite}@keyframes lampNext{0%,100%{box-shadow:0 0 0 2px rgba(255,197,82,.75),0 0 0 2px rgba(255,197,82,.35)}50%{box-shadow:0 0 0 2px rgba(255,197,82,.75),0 0 0 10px rgba(255,197,82,0)}}}
.promo-msg{border-radius:16px 16px 16px 6px;overflow:hidden;background:color-mix(in srgb,var(--accent) 8%,var(--surface));box-shadow:inset 0 0 0 1px var(--line)}.promo-msg img{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover}.promo-msg p{margin:8px 12px;font-size:14px;line-height:1.4}.promo-msg p:last-child{margin-bottom:12px}

    MAP='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('проспект Степана Бандери 23 Київ');

var MG={uk:['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'],
        ru:['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],
        en:['January','February','March','April','May','June','July','August','September','October','November','December']};
var MN={uk:['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'],
        ru:['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],en:['January','February','March','April','May','June','July','August','September','October','November','December']};

        ru:['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],
        en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']};
var WS={uk:['НД','ПН','ВТ','СР','ЧТ','ПТ','СБ'],ru:['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'],en:['SU','MO','TU','WE','TH','FR','SA']};

/* Weekly rhythm and November specials: the church's Instagram post of 31 Oct 2026; times confirmed by the church. */
var RULES=[],SPECIALS=[],ALL=[];
/* Verse of the day: 31 New Testament verses, the same list and day formula as the bot. */
var VERSES=[{"loc": [0, 5, 14], "ref": {"uk": "Матвія 5:14", "ru": "Матфея 5:14", "en": "Matthew 5:14"}, "t": {"uk": "Ви світло для світу. Не може сховатися місто, що стоїть на верховині гори.", "ru": "Вы — свет мира. Не может укрыться город, стоящий на верху горы.", "en": "Ye are the light of the world. A city that is set on an hill cannot be hid."}}, {"loc": [3, 3, 16], "ref": {"uk": "Івана 3:16", "ru": "Иоанна 3:16", "en": "John 3:16"}, "t": {"uk": "Так бо Бог полюбив світ, що дав Сина Свого Однородженого, щоб кожен, хто вірує в Нього, не згинув, але мав життя вічне.", "ru": "Ибо так возлюбил Бог мир, что отдал Сына Своего Единородного, дабы всякий верующий в Него, не погиб, но имел жизнь вечную.", "en": "For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."}}, {"loc": [8, 4, 16], "ref": {"uk": "1 Івана 4:16", "ru": "1 Иоанна 4:16", "en": "1 John 4:16"}, "t": {"uk": "Ми пізнали й увірували в ту любов, що Бог її має до нас. Бог є любов, і хто пробуває в любові, пробуває той в Бозі, і в нім Бог пробуває!", "ru": "И мы познали любовь, которую имеет к нам Бог, и уверовали в нее. Бог есть любовь, и пребывающий в любви пребывает в Боге, и Бог в нем.", "en": "And we have known and believed the love that God hath to us. God is love; and he that dwelleth in love dwelleth in God, and God in him."}}, {"loc": [1, 5, 36], "ref": {"uk": "Марка 5:36", "ru": "Марка 5:36", "en": "Mark 5:36"}, "t": {"uk": "А Ісус, як почув слово сказане, промовляє до старшини синагоги: „Не лякайсь, — тільки віруй!", "ru": "Но Иисус, услышав сии слова, тотчас говорит начальнику синагоги: не бойся, только веруй.", "en": "As soon as Jesus heard the word that was spoken, he saith unto the ruler of the synagogue, Be not afraid, only believe."}}, {"loc": [17, 4, 13], "ref": {"uk": "Филип’ян 4:13", "ru": "Филиппийцам 4:13", "en": "Philippians 4:13"}, "t": {"uk": "Я все можу в Тім, Хто мене підкріпляє, — в Ісусі Христі.", "ru": "Все могу в укрепляющем меня Иисусе Христе.", "en": "I can do all things through Christ which strengtheneth me."}}, {"loc": [3, 8, 12], "ref": {"uk": "Івана 8:12", "ru": "Иоанна 8:12", "en": "John 8:12"}, "t": {"uk": "І знову Ісус промовляв до них, кажучи: „Я Світло для світу. Хто йде вслід за Мною, не буде ходити у темряві той, але матиме світло життя“.", "ru": "Опять говорил Иисус к народу и сказал им: Я свет миру; кто последует за Мною, тот не будет ходить во тьме, но будет иметь свет жизни.", "en": "Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life."}}, {"loc": [19, 5, 16], "ref": {"uk": "1 Солунян 5:16", "ru": "1 Фессалоникийцам 5:16", "en": "1 Thessalonians 5:16"}, "t": {"uk": "Завжди радійте!", "ru": "Всегда радуйтесь.", "en": "Rejoice evermore."}}, {"loc": [0, 11, 28], "ref": {"uk": "Матвія 11:28", "ru": "Матфея 11:28", "en": "Matthew 11:28"}, "t": {"uk": "Прийдіть до Мене, усі струджені та обтяжені, — і Я вас заспокою!", "ru": "Придите ко Мне все труждающиеся и обремененные, и Я успокою вас;", "en": "Come unto me, all ye that labour and are heavy laden, and I will give you rest."}}, {"loc": [12, 8, 28], "ref": {"uk": "Римлян 8:28", "ru": "Римлянам 8:28", "en": "Romans 8:28"}, "t": {"uk": "І знаємо, що тим, хто любить Бога, хто покликаний Його постановою, усе допомагає на добре.", "ru": "Притом знаем, что любящим Бога, призванным по Его изволению, все содействует ко благу.", "en": "And we know that all things work together for good to them that love God, to them who are the called according to his purpose."}}, {"loc": [17, 4, 6], "ref": {"uk": "Филип’ян 4:6", "ru": "Филиппийцам 4:6", "en": "Philippians 4:6"}, "t": {"uk": "Ні про що не турбуйтесь, а в усьому нехай виявляються Богові ваші бажання молитвою й проханням з подякою.", "ru": "Не заботьтесь ни о чем, но всегда в молитве и прошении с благодарением открывайте свои желания пред Богом,", "en": "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God."}}, {"loc": [0, 6, 33], "ref": {"uk": "Матвія 6:33", "ru": "Матфея 6:33", "en": "Matthew 6:33"}, "t": {"uk": "Шукайте ж найперш Царства Божого й праведности Його, — а все це вам додасться.", "ru": "Ищите же прежде Царства Божия и правды Его, и это все приложится вам.", "en": "But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."}}, {"loc": [3, 14, 27], "ref": {"uk": "Івана 14:27", "ru": "Иоанна 14:27", "en": "John 14:27"}, "t": {"uk": "Зоставляю вам мир, мир Свій вам даю! Я даю вам не так, як дає світ. Серце ваше нехай не тривожиться, ані не лякається!", "ru": "Мир оставляю вам, мир Мой даю вам; не так, как мир дает, Я даю вам. Да не смущается сердце ваше и да не устрашается.", "en": "Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid."}}, {"loc": [12, 12, 2], "ref": {"uk": "Римлян 12:2", "ru": "Римлянам 12:2", "en": "Romans 12:2"}, "t": {"uk": "і не стосуйтесь до віку цього, але перемініться відновою вашого розуму, щоб пізнати вам, що то є воля Божа, — добро, приємність та досконалість.", "ru": "и не сообразуйтесь с веком сим, но преобразуйтесь обновлением ума вашего, чтобы вам познавать, что есть воля Божия, благая, угодная и совершенная.", "en": "And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God."}}, {"loc": [15, 5, 22], "ref": {"uk": "Галатів 5:22", "ru": "Галатам 5:22", "en": "Galatians 5:22"}, "t": {"uk": "А плід Духа: любов, радість, мир, довготерпіння, лагідність, добрість, вірність,", "ru": "Плод же духа: любовь, радость, мир, долготерпение, благость, милосердие, вера,", "en": "But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith,"}}, {"loc": [16, 2, 8], "ref": {"uk": "Ефесян 2:8", "ru": "Ефесянам 2:8", "en": "Ephesians 2:8"}, "t": {"uk": "Бо спасені ви благодаттю через віру, а це не від вас, то дар Божий,", "ru": "Ибо благодатью вы спасены через веру, и сие не от вас, Божий дар:", "en": "For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:"}}, {"loc": [14, 5, 17], "ref": {"uk": "2 Коринтян 5:17", "ru": "2 Коринфянам 5:17", "en": "2 Corinthians 5:17"}, "t": {"uk": "Тому то, коли хто в Христі, той створіння нове, - стародавнє минуло, ото сталось нове!", "ru": "Итак, кто во Христе, тот новая тварь; древнее прошло, теперь все новое.", "en": "Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new."}}, {"loc": [25, 11, 1], "ref": {"uk": "Євреїв 11:1", "ru": "Евреям 11:1", "en": "Hebrews 11:1"}, "t": {"uk": "А віра — то підстава сподіваного, доказ небаченого.", "ru": "Вера же есть осуществление ожидаемого и уверенность в невидимом.", "en": "Now faith is the substance of things hoped for, the evidence of things not seen."}}, {"loc": [5, 1, 5], "ref": {"uk": "Якова 1:5", "ru": "Иакова 1:5", "en": "James 1:5"}, "t": {"uk": "А якщо кому з вас не стачає мудрости, нехай просить від Бога, що всім дає просто, та не докоряє, — і буде вона йому дана.", "ru": "Если же у кого из вас недостает мудрости, да просит у Бога, дающего всем просто и без упреков, — и дастся ему.", "en": "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."}}, {"loc": [6, 5, 7], "ref": {"uk": "1 Петра 5:7", "ru": "1 Петра 5:7", "en": "1 Peter 5:7"}, "t": {"uk": "Покладіть на Нього всю вашу журбу, бо Він опікується вами!", "ru": "Все заботы ваши возложите на Него, ибо Он печется о вас.", "en": "Casting all your care upon him; for he careth for you."}}, {"loc": [0, 7, 7], "ref": {"uk": "Матвія 7:7", "ru": "Матфея 7:7", "en": "Matthew 7:7"}, "t": {"uk": "Про function dvRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
/* Background pattern by level: interference, neural net, sound waves, lattice, orbits, rays. Seeded per card. */
function dvPattern(n,lv){var r=dvRng(n*97+13),o='',i,j;
  if(lv===0){var ax=60+r()*60,ay=70+r()*60,bx=180+r()*60,by=170+r()*70;for(i=1;i<=7;i++){o+='<circle cx="'+ax.toFixed(0)+'" cy="'+ay.toFixed(0)+'" r="'+(i*30)+'"/><circle cx="'+bx.toFixed(0)+'" cy="'+by.toFixed(0)+'" r="'+(i*30-12)+'"/>';}return '<g class="breathe">'+o+'</g>';}
  if(lv===1){var pts=[];for(i=0;i<16;i++)pts.push([20+r()*260,20+r()*260]);for(i=0;i<pts.length;i++){var best=[];for(j=0;j<pts.length;j++)if(j!==i)best.push([Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]),j]);best.sort(function(a,b){return a[0]-b[0];});
      for(j=0;j<2;j++){var q=pts[best[j][1]];o+='<path d="M'+pts[i][0].toFixed(0)+' '+pts[i][1].toFixed(0)+'L'+q[0].toFixed(0)+' '+q[1].toFixed(0)+'"/>';}o+='<circle class="f" cx="'+pts[i][0].toFixed(0)+'" cy="'+pts[i][1].toFixed(0)+'" r="'+(3+r()*3).toFixed(1)+'"/>';}return o;}
  if(lv===2){for(i=0;i<9;i++){var y=24+i*31,amp=6+r()*16,per=30+r()*50,d='M0 '+y;for(j=0;j<=300;j+=10)d+='L'+j+' '+(y+Math.sin(j/per*6.283+i)*amp).toFixed(1);o+='<path d="'+d+'"/>';}return o;}
  if(lv===3){var s=28+Math.floor(r()*3)*6;for(i=0;i*s<330;i++)for(j=0;j*s<330;j++){var xx=j*s+(i%2?s/2:0),yy=i*s*0.87;o+='<circle class="f" cx="'+xx.toFixed(0)+'" cy="'+yy.toFixed(0)+'" r="2.2"/>';if(r()<.28)o+='<path d="M'+xx.toFixed(0)+' '+yy.toFixed(0)+'l'+(s/2)+' '+(s*0.87).toFixed(0)+'"/>';}return o;}
  if(lv===4){for(i=0;i<5;i++){var rx=60+i*26,ry=22+i*14+r()*14,rot=Math.floor(r()*180);o+='<ellipse cx="150" cy="150" rx="'+rx+'" ry="'+ry.toFixed(0)+'" transform="rotate('+rot+' 150 150)"/>';var an=r()*6.283,ex=150+Math.cos(an)*rx,ey=150+Math.sin(an)*ry;o+='<circle class="f" cx="'+ex.toFixed(0)+'" cy="'+ey.toFixed(0)+'" r="4" transform="rotate('+rot+' 150 150)"/>';}return '<g class="spin">'+o+'</g>';}
  var k=18+Math.floor(r()*10);for(i=0;i<k;i++){var a=i/k*6.283,l=110+r()*110;o+='<path d="M'+(150+Math.cos(a)*62).toFixed(0)+' '+(150+Math.sin(a)*62).toFixed(0)+'L'+(150+Math.cos(a)*l).toFixed(0)+' '+(150+Math.sin(a)*l).toFixed(0)+'"/>';}return '<g class="spin">'+o+'</g>';}

      '<div class="row">'+(n<48?'<button class="btn accent" data-act="dvOpen" data-v="'+(n+1)+'">'+x('Наступна картка','Следующая карточка')+'</button>':'')+'<button class="btn tint" data-act="dvBack">'+x('До шляху','К пути')+'</button></div></section>';}

/* Neuroscience carousel: each fact lights up the brain regions it involves; the brain glows more as you scroll */
function dvNS(){return [
 ['net',x('Нейропластичність','Нейропластичность','Neuroplasticity'),
  x('Мозок не застиглий. Кожна думка й дія проходить мережею нейронів, і шлях, яким ходять часто, фізично зміцнюється: синапси товщають, сигнал іде швидше. Що повторюєш, тим і стаєш.','Мозг не застывший. Каждая мысль и действие проходит сетью нейронов, и путь, по которому ходят часто, физически укрепляется: синапсы утолщаются, сигнал идёт быстрее. Что повторяешь, тем и становишься.','The brain is not fixed. Every thought and action travels a network of neurons, and a path used often is physically strengthened: synapses thicken, the signal runs faster. What you repeat, you become.'),
  x('Гебб, 1949; Маґуайр та ін., гіпокамп лондонських таксистів, 2000','Хебб, 1949; Магуайр и др., гиппокамп лондонских таксистов, 2000','Hebb, 1949; Maguire et al., hippocampus of London taxi drivers, 2000')],
 ['pfc',x('Увага керує мозком','Внимание управляет мозгом','Attention steers the brain'),
  x('Префронтальна кора вирішує, що підсилити, а що загасити. Майже половину часу неспання розум блукає, і в ці хвилини людина почувається гірше. Повертаючи увагу до того, що перед тобою, ти тренуєш саме цей «диригентський» центр.','Префронтальная кора решает, что усилить, а что погасить. Почти половину времени бодрствования ум блуждает, и в эти минуты человек чувствует себя хуже. Возвращая внимание к тому, что перед тобой, ты тренируешь именно этот «дирижёрский» центр.','The prefrontal cortex decides what to amplify and what to mute. The mind wanders almost half of waking time, and in those minutes people feel worse. Bringing attention back to what is in front of you trains exactly this «conductor».'),
  x('Кіллінґсворт і Ґілберт, Гарвард, 2010','Киллингсворт и Гилберт, Гарвард, 2010','Killingsworth and Gilbert, Harvard, 2010')],
 ['dmn',x('Слово, приміряне на себе','Слово, примеренное на себя','A word applied to yourself'),
  x('Інформацію, яку людина пов’язує з собою, мозок запам’ятовує значно краще: вмикається медіальна префронтальна кора, центр «я». Тому картка не пояснює абстрактно, а питає: де це в моєму житті?','Информацию, которую человек связывает с собой, мозг запоминает значительно лучше: включается медиальная префронтальная кора, центр «я». Поэтому карточка не объясняет абстрактно, а спрашивает: где это в моей жизни?','Information a person links to themselves is remembered far better: the medial prefrontal cortex, the brain\'s «self» hub, switches on. So a card does not explain in the abstract; it asks: where is this in my life?'),
  x('Роджерс та ін., 1977; Келлі та ін., 2002','Роджерс и др., 1977; Келли и др., 2002','Rogers et al., 1977; Kelley et al., 2002')],
 ['amy',x('Назвати чесно','Назвать честно','Name it honestly'),
  x('Коли людина словами називає свій стан, активність мигдалини, центру тривоги, знижується, а лобові відділи беруть керування на себе. Чесне «Сплю», «Бачу» чи «Живу» не самокритика, а спосіб повернути собі контроль.','Когда человек словами называет своё состояние, активность миндалины, центра тревоги, снижается, а лобные отделы берут управление на себя. Честное «Сплю», «Вижу» или «Живу» не самокритика, а способ вернуть себе контроль.','When you put your state into words, activity in the amygdala, the alarm centre, drops and the frontal regions take control. An honest «Asleep», «I see» or «I live it» is not self-criticism; it is a way to take back control.'),
  x('Ліберман та ін., UCLA, 2007','Либерман и др., UCLA, 2007','Lieberman et al., UCLA, 2007')],
 ['plan',x('Намір стає дією','Намерение становится действием','Intention becomes action'),
  x('План «Коли X, я роблю Y» переносить запуск дії з виснажливої сили волі на автоматичний сигнал ситуації. В огляді 94 досліджень такі плани помітно частіше доводили намір до справи.','План «Когда X, я делаю Y» переносит запуск действия с изнурительной силы воли на автоматический сигнал ситуации. В обзоре 94 исследований такие планы заметно чаще доводили намерение до дела.','A «When X, I do Y» plan moves the trigger for action from draining willpower to an automatic cue in the situation. In a review of 94 studies such plans turned intention into action markedly more often.'),
  x('Ґолльвітцер і Ширан, 2006','Голльвитцер и Ширан, 2006','Gollwitzer and Sheeran, 2006')],
 ['bg',x('Дія будує навичку','Действие строит навык','Action builds the skill'),
  x('Знання живе в корі, а звичка в базальних гангліях. Туди вона потрапляє лише через виконання, не через розуміння. Нова поведінка стає автоматичною в середньому за 66 днів повторень, тому кожна практика тут на 24 години, а не на думку.','Знание живёт в коре, а привычка в базальных ганглиях. Туда она попадает только через выполнение, не через понимание. Новое поведение становится автоматическим в среднем за 66 дней повторений, поэтому каждая практика здесь на 24 часа, а не на мысль.','Knowledge lives in the cortex; habit lives in the basal ganglia. It gets there only through doing, not understanding. New behaviour becomes automatic after about 66 days of repetition on average, so every practice here is a 24-hour deed, not a thought.'),
  x('Ґрейбіл, MIT, 2008; Леллі та ін., UCL, 2010','Грейбил, MIT, 2008; Лалли и др., UCL, 2010','Graybiel, MIT, 2008; Lally et al., UCL, 2010')],
 ['hip',x('Пригадати сильніше, ніж перечитати','Вспомнить сильнее, чем перечитать','Recall beats rereading'),
  x('Кожна спроба дістати знання з пам’яті перезаписує його в гіпокампі міцніше. Повтор через 1, 7 і 30 днів збігається з кривою забування, тож картка повертається саме тоді, коли починає стиратися.','Каждая попытка достать знание из памяти перезаписывает его в гиппокампе прочнее. Повтор через 1, 7 и 30 дней совпадает с кривой забывания, поэтому карточка возвращается именно тогда, когда начинает стираться.','Each attempt to pull knowledge from memory rewrites it more firmly in the hippocampus. Reviews at 1, 7 and 30 days follow the forgetting curve, so a card returns exactly when it starts to fade.'),
  x('Ебінґгауз, 1885; Редіґер і Карпіке, 2006; Сепеда та ін., 2006','Эббингауз, 1885; Редигер и Карпике, 2006; Сепеда и др., 2006','Ebbinghaus, 1885; Roediger and Karpicke, 2006; Cepeda et al., 2006')],
 ['all',x('Цикл, що змінює людину','Цикл, который меняет человека','The loop that changes a person'),
  x('Слово дає напрям, увага тримає фокус, чесність знімає тривогу, план запускає дію, дія будує навичку, повторення закріплює. Коли цей цикл проходить знову й знову, змінюється не настрій, а сама архітектура мислення. Віра стає не знанням про Бога, а способом бачити й діяти.','Слово даёт направление, внимание держит фокус, честность снимает тревогу, план запускает действие, действие строит навык, повторение закрепляет. Когда этот цикл проходит снова и снова, меняется не настроение, а сама архитектура мышления. Вера становится не знанием о Боге, а способом видеть и действовать.','The word gives direction, attention holds the focus, honesty eases anxiety, a plan triggers action, action builds skill, review makes it last. When this loop runs again and again, it is not your mood that changes but the very architecture of your thinking. Faith becomes not knowledge about God but a way of seeing and acting.'),
  x('«Перемініться оновленням розуму вашого». Римлян 12:2','«Преобразуйтесь обновлением ума вашего». Римлянам 12:2','«Be ye transformed by the renewing of your mind». Romans 12:2')]];}
/* where each node sits on the brain, and on which slide it first lights up */
var DV_NODES=[[62,78,'pfc',1],[78,52,'dmn',2],[150,56,'dmn',2],[118,104,'amy',3],[92,66,'plan',4],[112,90,'bg',5],[130,40,'bg',5],[176,132,'bg',5],[134,112,'hip',6],[196,86,'net',0],[104,128,'net',0],[170,100,'net',0]];

setInterval(function(){document.querySelectorAll('[data-cd]').forEach(function(el){var c=cdText(+el.dataset.cd);el.textContent=c?', '+c:'';});if(!motionOk())paintStatic();},30000);
function start(data){load();if(data&&data.lang)merge(data);
  var h=(location.hash||'').replace('#','');
  if(!nav(h)){if(state.sub&&SUBS.indexOf(state.sub)<0&&state.sub!=='room')state.sub=null;if(TABS.indexOf(state.tab)<0){var old=state.tab;state.tab='today';if(old==='heaven'||old==='prayer')nav(old);}if(state.sub==='guide'){state.sub=null;state.tab='guide';}}
  if(state.lang==='en'&&!window.EN)loadEn(function(){langData();boot();});else{langData();boot();}}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){var o={};for(var k in state)if(TRANSIENT.indexOf(k)<0)o[k]=state[k];return JSON.parse(JSON.stringify(o));});
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
})();
